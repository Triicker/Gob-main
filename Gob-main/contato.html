<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASTA! - Fale Conosco</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/language-system.css">

    <style>
        /* ========== RESET & VARIÁVEIS ========== */
        :root {
            --purple-dark: #5B1A6E;
            --purple: #7B2D8E;
            --purple-light: #9B4DB0;
            --magenta: #D4388E;
            --gold: #F5C518;
            --cream: #FDF5E6;
            --text-dark: #333;
            --text-light: #fff;
            --bg-cream: #FFF8EE;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; color: var(--text-dark); background: #fff; line-height: 1.7; overflow-x: hidden; }
        
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        ul { list-style: none; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }

        /* ========== COMPONENTES REUTILIZÁVEIS ========== */
        .container { max-width: 1250px; margin: 0 auto; padding: 0 20px; }
        .btn { 
            display: inline-block; 
            padding: 14px 36px; 
            border-radius: 50px; 
            font-weight: 700; 
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }
        .btn-purple { background: var(--purple); color: white; }
        .btn-purple:hover { background: var(--purple-dark); transform: translateY(-3px); }

        /* ========== HEADER & NAV ========== */
        header { 
            background-color: var(--purple-dark);
            background-image: url('img/headerdeep.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            padding: 15px 0; 
            position: fixed; 
            top: 0; 
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo {
            display: flex;
            align-items: center;
            line-height: 1;
            margin-right: 20px;
        }
        .logo img {
            height: 50px;
            width: auto;
        }
        .nav-links { display: flex; gap: 5px; align-items: center; }
        .nav-links a { 
            font-weight: 500; 
            font-size: 0.8rem; 
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--gold); background: rgba(255,255,255,0.1); }
        .nav-links a.nav-cta {
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .nav-links a.nav-cta:hover { background: rgba(255,255,255,0.25); }
        .mobile-menu-icon { display: none; font-size: 1.5rem; color: #fff; cursor: pointer; }

        /* ========== CONTEÚDO PRINCIPAL ========== */
        .section-title {
            font-size: 2.8rem;
            text-align: center;
            color: var(--purple-dark);
            margin-bottom: 40px;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--purple), var(--magenta));
            border-radius: 2px;
        }

        /* ========== CONTATO ========== */
        #contato {
            position: relative;
            min-height: 100vh;
            padding: 96px 0 70px;
            overflow: hidden;
            background-color: var(--bg-cream);
            background-image: url('img/conosco.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
        }
        #contato > .container {
            position: relative;
            z-index: 1;
        }
        #contato .section-title {
            width: min(430px, 38vw);
            margin: 0 8% 28px auto;
            font-family: 'Inter', sans-serif;
            font-size: clamp(1.35rem, 2.2vw, 2rem);
            font-weight: 800;
            line-height: 1.15;
        }
        .contact-area-centered {
            width: min(430px, 38vw);
            margin: 0 8% 0 auto;
            padding: 18px 20px 20px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 14px;
            background: var(--purple-dark);
            box-shadow: 0 18px 45px rgba(55,0,70,0.24);
        }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: 700; font-size: 0.62rem; color: #fff; }
        input, textarea, select { 
            width: 100%; 
            padding: 7px 9px;
            border: 0;
            border-radius: 2px;
            font-family: inherit; 
            font-size: 0.66rem;
            line-height: 1.2;
            background: #fff;
            color: var(--purple-dark);
            transition: var(--transition);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--magenta);
        }
        select:disabled { color: #7f7485; background: #eeeaf0; cursor: not-allowed; }
        [aria-invalid="true"] { box-shadow: 0 0 0 2px #e74c3c; }
        .location-status {
            display: block;
            min-height: 0;
            color: #fff;
            font-size: 0.62rem;
            line-height: 1.25;
            margin-top: 3px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .contact-area-centered textarea { min-height: 62px; resize: vertical; }
        .contact-area-centered .btn-purple {
            width: 100%;
            margin-top: 3px;
            padding: 8px 16px;
            border-radius: 2px;
            background: #fff;
            color: var(--purple-dark);
            font-size: 0.72rem;
        }
        .contact-area-centered .btn-purple:hover { background: #ffeaf7; color: var(--purple-dark); }

        /* ========== FOOTER ========== */
        footer { 
            background: #6D2573; 
            color: #fff; 
            padding: 0; 
        }
        .footer-banner-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 40px;
            background: #6D2573;
            gap: 30px;
        }
        .footer-banner {
            height: auto;
            display: block;
            object-fit: contain;
        }
        .footer-img-left { max-height: 60px; }
        .footer-img-right { max-height: 60px; }
       

        /* ========== WHATSAPP FLOATING ========== */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: var(--transition);
            animation: pulse-whatsapp 2s infinite;
        }
        .whatsapp-float img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }
        @keyframes pulse-whatsapp {
            0%, 100% { filter: drop-shadow(0 4px 12px rgba(37,211,102,0.4)); }
            50% { filter: drop-shadow(0 6px 20px rgba(37,211,102,0.6)); }
        }

        /* ========== RESPONSIVIDADE ========== */
        @media (max-width: 768px) {
            .nav-links { 
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: rgba(91, 26, 110, 0.98);
                padding: 20px;
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
                gap: 5px;
            }
            .nav-links.active { display: flex; }
            .nav-links.active a { color: #fff; }
            .nav-links.active a:hover { color: var(--gold); background: rgba(255,255,255,0.1); }
            .nav-links.active a.nav-cta { color: #fff; background: var(--purple); border: 1px solid rgba(255,255,255,0.3); }
            .mobile-menu-icon { display: block; }
            .form-row { grid-template-columns: 1fr; }
            #contato {
                min-height: 0;
                padding: 100px 0 60px;
                background-position: 24% top;
                background-size: auto 100%;
            }
            #contato .section-title {
                width: auto;
                margin-bottom: 26px;
            }
            .contact-area-centered {
                width: min(100%, 430px);
                margin: 0 auto;
            }
            .footer-banner-wrap { flex-direction: column; padding: 40px 30px; gap: 20px; }
            .footer-img-left,
            .footer-img-right { width: 100%; max-width: 520px; max-height: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="img/site-BASTA-copiar_0000s_0015_BASTA-logo2.png" alt="BASTA! - De violência contra a mulher">
                </a>
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html#projeto" data-i18n="nav.project">O projeto</a></li>
                    <li><a href="index.html#aplicativo" data-i18n="nav.app">O aplicativo</a></li>
                    <li><a href="index.html#colecao" data-i18n="nav.collection">A coleção</a></li>
                    <li><a href="index.html#legal" data-i18n="nav.legal">Fundamentação legal</a></li>
                    <li><a href="index.html#parceiros" data-i18n="nav.partners">Parceiros e clientes</a></li>
                    <li><a href="index.html#conheca-app" data-i18n="nav.knowApp">Conheça o aplicativo</a></li>
                    <li><a href="#" class="nav-cta" data-i18n="nav.contact">Fale conosco</a></li>
                    <li class="lang-selector">
                        <button class="lang-btn active" data-lang="pt" title="Português">🇧🇷</button>
                        <button class="lang-btn" data-lang="en" title="English">🇺🇸</button>
                        <button class="lang-btn" data-lang="es" title="Español">🇪🇸</button>
                        <button class="lang-btn" data-lang="fr" title="Français">🇫🇷</button>
                    </li>
                </ul>
                <div class="mobile-menu-icon" id="menuIcon"><i class="fas fa-bars"></i></div>
            </nav>
        </div>
    </header>

    <!-- CONTATO -->
    <section id="contato">
        <div class="container">
            <h2 class="section-title" data-i18n="contact.title">Fale conosco</h2>
            <div class="contact-area-centered">
                <form id="contatoForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contatoNome" data-i18n="contact.name">Nome completo *</label>
                            <input type="text" id="contatoNome" name="nome" placeholder="Seu nome" minlength="2" maxlength="120" pattern=".*[^\d\s].*" required>
                        </div>
                        <div class="form-group">
                            <label for="contatoEmail" data-i18n="contact.email">E-mail *</label>
                            <input type="email" id="contatoEmail" name="email" placeholder="seu@email.com" maxlength="254" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contatoTelefone" data-i18n="contact.phone">Telefone *</label>
                            <input type="tel" id="contatoTelefone" name="telefone" placeholder="(00) 00000-0000" inputmode="tel" maxlength="15" pattern="\(\d{2}\) \d{4,5}-\d{4}" required>
                        </div>
                        <div class="form-group">
                            <label for="contatoEstado">Estado *</label>
                            <select id="contatoEstado" name="estado" required>
                                <option value="">Selecione o estado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contatoCidade">Cidade *</label>
                            <select id="contatoCidade" name="cidade" required disabled>
                                <option value="">Selecione a cidade</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="contatoInstituicao">Nome da instituição</label>
                            <input type="text" id="contatoInstituicao" name="instituicao" placeholder="Nome da escola" maxlength="200">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contatoMensagem" data-i18n="contact.message">Mensagem *</label>
                        <textarea id="contatoMensagem" name="mensagem" rows="4" placeholder="Como podemos ajudar?" minlength="3" maxlength="4000" required></textarea>
                    </div>
                    
                    <!-- Campo honeypot para proteção anti-bot (não remover) -->
                    <input 
                        type="text" 
                        name="website" 
                        style="position:absolute;left:-9999px;width:1px;height:1px;" 
                        tabindex="-1" 
                        autocomplete="off"
                        aria-hidden="true"
                    >
                    
                    <button type="submit" class="btn btn-purple" aria-live="polite"><span data-i18n="contact.submit">Enviar mensagem</span></button>
                </form>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-banner-wrap">
            <img src="img/Grupo-133-1.png" alt="Ética Editora - redes sociais" class="footer-banner footer-img-left">
            <img src="img/Grupo-132.png" alt="Empresa credenciada - selos" class="footer-banner footer-img-right">
        </div>
    </footer>

    <!-- WHATSAPP FLOATING BUTTON -->
    <a href="https://wa.me/5511987380525" target="_blank" class="whatsapp-float">
        <img src="img/09.whatsapp.png" alt="WhatsApp">
    </a>

    <script src="js/brasil-localidades.js"></script>
    <script>
        // Menu Mobile Toggle
        const menuIcon = document.getElementById('menuIcon');
        const navLinks = document.getElementById('navLinks');

        menuIcon.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close menu on link click (mobile)
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });

        // Form de contato — envio pelo Worker do mesmo domínio
        const contatoForm = document.getElementById('contatoForm');
        let contatoFeedbackTimer = null;

        async function readJsonSafely(response) {
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes('application/json')) return null;

            const body = await response.text();
            if (!body.trim()) return null;

            try {
                return JSON.parse(body);
            } catch {
                return null;
            }
        }

        BrasilLocalidades.initStateCityPair({
            state: '#contatoEstado',
            city: '#contatoCidade',
            stateRequired: true,
            cityRequired: true
        });
        BrasilLocalidades.bindPhoneMask('#contatoTelefone');
        BrasilLocalidades.bindValidationState(contatoForm);

        if (contatoForm) {
            contatoForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = contatoForm.querySelector('button[type="submit"]');
                if (btn.disabled || !contatoForm.reportValidity()) return;
                window.clearTimeout(contatoFeedbackTimer);
                const conteudoOriginal = btn.innerHTML;
                btn.textContent = 'Enviando...';
                btn.disabled = true;

                try {
                    const values = Object.fromEntries(new FormData(contatoForm));
                    const res = await fetch('/api/contact', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nome: values.nome,
                            telefone: values.telefone,
                            email: values.email,
                            instituicao: values.instituicao,
                            estado: values.estado,
                            cidade: values.cidade,
                            mensagem: values.mensagem,
                            website: values.website
                        })
                    });
                    const data = await readJsonSafely(res);
                    if (res.ok && data?.success) {
                        contatoForm.reset();
                        btn.textContent = 'Mensagem enviada com sucesso!';
                    } else {
                        btn.textContent = 'Não foi possível enviar. Tente novamente.';
                    }
                } catch (err) {
                    console.error('Erro:', err);
                    btn.textContent = 'Não foi possível enviar. Tente novamente.';
                } finally {
                    contatoFeedbackTimer = window.setTimeout(() => {
                        btn.innerHTML = conteudoOriginal;
                        btn.disabled = false;
                    }, 3000);
                }
            });
        }
    </script>

    <!-- Language Selector & Translation System (Shared) -->
    <script src="js/translations.js"></script>
    <script src="js/language-system.js"></script>
</body>
</html>
