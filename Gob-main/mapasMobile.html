var polygonTemplate = polygonSeries.mapPolygons.template;
polygonTemplate.nonScalingStroke = true;
polygonTemplate.strokeWidth = 0.5;
// Cor interna dos estados
polygonSeries.mapPolygons.template.fill = am4core.color("#C1088A");

// Borda dos estados (as linhas divisórias)
polygonSeries.mapPolygons.template.stroke = am4core.color("#FFFFFF");
polygonSeries.mapPolygons.template.strokeWidth = 2;

// Hover
var hs = polygonTemplate.states.create("hover");
hs.properties.fill = am4core.color("#590061");



// Event listener for clicks on map polygons
polygonTemplate.events.on("hit", function(ev) {
  const lang = localStorage.getItem('basta-lang') || 'pt';
  const t = (typeof translations !== 'undefined' && translations[lang]) ? translations[lang] : {};
  const data = ev.target.dataItem.dataContext;
  const infoCard = document.getElementById("infocard");

  const nome = data.nome || "";
  const uf = data.uf || "UF";
  const foto = data.foto || "";
  const instagram = data.perfil || "";

  const fotoHTML = foto
  
    ? `<div class="photo-container"><img src="${foto}" alt="${nome}" class="municipal-photo-img"></div>`
    : `<div class="municipal-photo-placeholder">${nome ? nome.charAt(0).toUpperCase() : '?'}</div>`;

  // 📌 Card da Embaixadora Estadual
  let html = `
    <div class="municipal-rep-card">
      <div class="state-title">${t['map.stateAmbassador'] || 'Embaixadora Estadual'}</div>
      <div class="state-name">${uf}</div>
      ${fotoHTML}
      <div class="municipal-name">${nome || (t['map.defaultName'] || 'Nome da pessoa')}</div>
      <div class="municipal-profile">${instagram.replace('@', '')}</div>
      <div class="municipal-description">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
      </div>
      <a href="#" class="know-more-link">${t['map.knowMore'] || 'Conheça todas as embaixadoras'}</a>
    </div>
  `;

  // 🏙️ Cards Municipais
  if (data.municipais && Array.isArray(data.municipais)) {
    html += `<div class="municipal-section-title">${t['map.municipalSection'] || 'Embaixadoras Municipais'}</div>`;

    data.municipais.forEach(rep => {
      const repFotoHTML = rep.foto
        ? `<div class="photo-container"><img src="${rep.foto}" alt="${rep.nome}" class="municipal-photo-img"></div>`
        : `<div class="municipal-photo-placeholder">${rep.nome ? rep.nome.charAt(0).toUpperCase() : '?'}</div>`;

      html += `
        <div class="municipal-rep-card">
          <div class="state-title">${t['map.municipalAmbassador'] || 'Embaixadora Municipal'}</div>
          <div class="state-name">${rep.cidade}</div>
          ${repFotoHTML}
          <div class="municipal-name">${rep.nome || (t['map.defaultName'] || 'Nome da pessoa')}</div>
          <div class="municipal-profile">${rep.perfil ? rep.perfil.replace('@', '') : '@perfil'}</div>
          <div class="municipal-description">
            ${rep.descricao || "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat."}
          </div>
          <a href="#" class="know-more-link">${t['map.knowMore'] || 'Conheça todas as embaixadoras'}</a>
        </div>
      `;
    });
  }


  infoCard.innerHTML = html;
  infoCard.style.display = "block";
});
// Aguarda o mapa carregar completamente e ativa o clique no estado de São Paulo
chart.events.on("ready", function () {
  const spPolygon = polygonSeries.getPolygonById("BR-SP");
  if (spPolygon) {
    spPolygon.isActive = true;
    polygonTemplate.events.dispatchImmediately("hit", {
      type: "hit",
      target: spPolygon
    });
  }
});

// Série de imagem para marcadores personalizados
var imageSeries = chart.series.push(new am4maps.MapImageSeries());

// Adiciona um marcador em São Paulo
var marker = imageSeries.mapImages.create();
marker.latitude = -23.55; // Latitude de São Paulo
marker.longitude = -46.63; // Longitude de São Paulo
marker.nonScaling = true;

var icon = marker.createChild(am4core.Label);
icon.text = "📍";
icon.fontSize = 25;
icon.horizontalCenter = "middle";
icon.verticalCenter = "middle";
icon.tooltipText = "São Paulo - Representante Estadual";
